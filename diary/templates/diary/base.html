<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Мой дневник{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Шрифт в стиле handwriting -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Ваши стили -->
  <link href="{% static 'css/styles.css' %}" rel="stylesheet" />

  <!-- Font Awesome (иконки) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-pastel text-body">
  <!-- Верхняя навигация -->
  <header class="bg-white border-bottom sticky-top shadow-sm">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center py-2">
        <a class="brand" href="{% url 'diary:base' %}">Мой дневник</a>
        <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="container-fluid">
    <div class="row g-0">
      <!-- Боковое меню (десктоп) -->
      <aside class="col-lg-3 d-none d-lg-block bg-light border-end" style="min-height: calc(100vh - 56px);">
        {% include 'includes/inc_menu.html' %}
      </aside>

      <!-- Контент -->
      <main class="col-lg-9 px-4 py-3" style="min-height: calc(100vh - 56px);">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
