<nav class="nav flex-column p-2" aria-label="Основное меню" style="gap: .5rem;">
  <a class="nav-link text-dark" href="{% url 'diary:base' %}">Главная</a>
  <a class="nav-link text-dark" href="{% url 'diary:entry_list' %}">Записи</a>

  <hr class="bg-muted w-100 my-2" />

  {% if user.is_authenticated %}
  <a class="btn btn-outline-primary w-100 mb-2" href="{% url 'diary:entry_create' %}">Новая запись</a>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger w-100">Выйти</button>
  </form>
  {% else %}
  <a class="btn btn-outline-primary w-100 mb-2" href="{% url 'login' %}?next={{ request.path }}">Войти</a>
  <a class="btn btn-outline-primary w-100" href="{% url 'users:register' %}?next={{ request.path }}">Зарегистрироваться</a>
  {% endif %}
</nav>
